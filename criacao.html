<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato de Games</title>
    <link rel="stylesheet" href="criacao.css">
</head>
<body>

    <div class="container">
        <h1>Campeonato de Games</h1>
        <p>Preencha os dados para se inscrever!</p>

        <form>
            <div class="form-control">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-control">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-control">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="form-control">
                <label for="data">Data da inscrição:</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="form-control">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="form-control">
                <label for="jogo">Escolha seu jogo:</label>
                <select id="jogo" name="jogo" required>
                    <option value="">Selecione</option>
                    <option value="minecraft">Minecraft</option>
                    <option value="valorant">Valorant</option>
                    <option value="freefire">Free Fire</option>
                    <option value="fifa">EA Sports FC</option>
                </select>
            </div>

            <button type="submit">Inscrever-se</button>
        </form>
    </div>

</body>
</html>
